<!doctype html>

<head>
	<meta charset="UTF-8" />
	<!-- 不自动检查电话号码 -->
	<meta name="format-detection" content="telephone=no" />
	<!-- 手机端网页不显示地址栏 -->
	<meta name="mobile-web-app-capable" content="yes" />
	<!-- 禁止缩放 手机端全屏 -->
	<meta name="viewport" content="user-scalable=no, viewport-fit=cover" />
	<title>无名杀</title>
	<style>
		.startup-loading {
			position: fixed;
			inset: 0;
			z-index: 2147483647;
			display: grid;
			place-items: center;
			padding: 24px;
			box-sizing: border-box;
			color: #eee7d8;
			background: radial-gradient(circle at 50% 42%, rgba(126, 103, 61, 0.3), transparent 42%), #171713;
			transition:
				opacity 240ms ease,
				visibility 240ms ease;
		}
		.startup-loading--hidden {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		.startup-loading__content {
			display: flex;
			flex-direction: column;
			align-items: center;
			width: min(320px, 100%);
			text-align: center;
		}
		.startup-loading__content > div {
			transition: none;
		}
		.startup-loading__title,
		.startup-loading__message,
		.startup-loading__hint {
			position: static;
			display: block;
			width: 100%;
		}
		.startup-loading__emblem {
			position: relative;
			display: grid;
			place-items: center;
			width: 84px;
			height: 84px;
			margin-bottom: 24px;
			color: #e4cf9d;
			font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
			font-size: 36px;
		}
		.startup-loading__emblem::before {
			content: "";
			position: absolute;
			inset: 0;
			border: 2px solid rgba(228, 207, 157, 0.18);
			border-top-color: #d6ba7c;
			border-radius: 50%;
			box-shadow: 0 0 32px rgba(214, 186, 124, 0.08);
			animation: startup-loading-rotate 1.1s linear infinite;
		}
		.startup-loading__title {
			margin-bottom: 12px;
			color: #e4cf9d;
			font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
			font-size: 28px;
			letter-spacing: 0.35em;
			text-indent: 0.35em;
		}
		.startup-loading__message {
			min-height: 24px;
			color: #eee7d8;
			font-size: 15px;
			line-height: 24px;
		}
		.startup-loading__track {
			position: relative;
			width: 200px;
			height: 3px;
			margin: 22px 0 16px;
			overflow: hidden;
			border-radius: 999px;
			background: rgba(228, 207, 157, 0.12);
		}
		.startup-loading__track::after {
			content: "";
			position: absolute;
			inset: 0 auto 0 0;
			width: 42%;
			border-radius: inherit;
			background: linear-gradient(90deg, transparent, #d6ba7c, transparent);
			animation: startup-loading-progress 1.6s ease-in-out infinite;
		}
		.startup-loading--determinate .startup-loading__track::after {
			width: var(--startup-progress);
			background: #d6ba7c;
			animation: none;
		}
		.startup-loading--compact {
			inset: auto 0 max(12px, env(safe-area-inset-bottom));
			margin-inline: auto;
			width: min(320px, calc(100% - 24px));
			padding: 8px 16px;
			border-radius: 8px;
			background: #171713;
			pointer-events: none;
		}
		.startup-loading--compact .startup-loading__track {
			margin: 4px 0;
			max-width: 100%;
		}
		.startup-loading--compact .startup-loading__emblem,
		.startup-loading--compact .startup-loading__title,
		.startup-loading--compact .startup-loading__hint {
			display: none;
		}
		.startup-loading__hint {
			color: rgba(238, 231, 216, 0.55);
			font-size: 12px;
			line-height: 20px;
		}
		.startup-loading--error .startup-loading__emblem::before {
			border-color: rgba(216, 132, 112, 0.3);
			border-top-color: #d88470;
			animation: none;
		}
		.startup-loading--error .startup-loading__track,
		.startup-loading--error .startup-loading__hint {
			display: none;
		}
		@keyframes startup-loading-rotate {
			to {
				transform: rotate(360deg);
			}
		}
		@keyframes startup-loading-progress {
			from {
				transform: translateX(-110%);
			}
			to {
				transform: translateX(260%);
			}
		}
		@media (prefers-reduced-motion: reduce) {
			.startup-loading,
			.startup-loading__emblem::before,
			.startup-loading__track::after {
				animation: none;
				transition: none;
			}
		}
	</style>
	<script>
		"use strict";
		(() => {
			const getOverlay = () => document.getElementById("startup-loading");
			const setMessage = (overlay, message) => {
				const node = overlay.querySelector("[data-startup-loading-message]");
				if (node) node.textContent = message;
			};
			window.startupLoading = {
				show(message) {
					const overlay = getOverlay();
					if (!overlay) return;
					overlay.classList.remove("startup-loading--hidden", "startup-loading--error", "startup-loading--compact", "startup-loading--determinate");
					overlay.removeAttribute("aria-hidden");
					overlay.setAttribute("aria-busy", "true");
					if (message) setMessage(overlay, message);
				},
				progress(completed, total, compact, waitingForMode) {
					const overlay = getOverlay();
					if (!overlay) return;
					this.show(waitingForMode ? `基础资源 ${completed}/${total} · 选择模式后继续` : `正在加载基础资源… ${completed}/${total}`);
					overlay.classList.add("startup-loading--determinate");
					overlay.classList.toggle("startup-loading--compact", compact);
					const percent = total > 0 ? Math.min(100, Math.max(0, (completed / total) * 100)) : 0;
					overlay.style.setProperty("--startup-progress", `${percent}%`);
				},
				hide() {
					const overlay = getOverlay();
					if (!overlay) return;
					overlay.classList.add("startup-loading--hidden");
					overlay.setAttribute("aria-hidden", "true");
					overlay.setAttribute("aria-busy", "false");
				},
				fail() {
					const overlay = getOverlay();
					if (!overlay) return;
					overlay.classList.remove("startup-loading--hidden", "startup-loading--compact", "startup-loading--determinate");
					overlay.classList.add("startup-loading--error");
					overlay.removeAttribute("aria-hidden");
					overlay.setAttribute("aria-busy", "false");
					setMessage(overlay, "游戏资源加载失败，请根据提示处理后重试");
				},
			};
		})();
	</script>
	<script>
		"use strict";
		(() => {
			window.onerror = function (msg, src, line, column, err) {
				let str = `错误文件: ${typeof src == "string" && src.length > 0 ? decodeURI(src) : "未知文件"}`;
				str += `\n错误信息: ${msg}`;
				str += `\n行号: ${line}`;
				str += `\n列号: ${column}`;
				if (err && err.stack) str += "\n" + decodeURI(err.stack);
				console.error(str);
				window.startupLoading.fail();
				alert(str);
			};
			const STACK_REGEXP = /^\s*at .*(\S+:\d+|\(native\))/m;
			const errorList = [];
			function extractLocation(urlLike) {
				// 不存在地址信息的字符串
				if (!/:/.test(urlLike)) {
					return [urlLike];
				}

				// 捕获位置用到的正则
				const regExp = /(.+?)(?::(\d+))?(?::(\d+))?$/;
				const parts = regExp.exec(urlLike.replace(/[()]/g, ""));

				// @ts-ignore
				return [parts[1], parts[2] || void 0, parts[3] || void 0];
			}
			window.onunhandledrejection = async event => {
				event.promise.catch(error => {
					console.log(error);
					// 如果`error`是个错误，则继续处理
					if (error instanceof Error) {
						// 如果已经处理过该错误，则不再处理
						if (errorList.includes(error)) return;
						errorList.push(error);
						// 如果`error`拥有字符串形式的报错栈堆，且报错栈堆确实符合v8的stack
						if (typeof error.stack === "string" && STACK_REGEXP.test(error.stack)) {
							// 获取符合栈堆信息的字符串，一般来说就是从第二行开始的所有行
							// 为了处理eval的情况，故必须获取完行数
							let lines = error.stack.split("\n").filter(line => STACK_REGEXP.test(line));

							// 提供类型信息防止vscode报错
							/**
							 * @type {string | undefined}
							 */
							let fileName = void 0;

							/**
							 * @type {number | undefined}
							 */
							let line = void 0;

							/**
							 * @type {number | undefined}
							 */
							let column = void 0;

							// 从第一条开始遍历，一直遍历到不存在eval的位置
							for (let currentLine = 0; currentLine < lines.length; ++currentLine) {
								if (/\(eval /.test(lines[currentLine])) continue;

								let formatedLine = lines[currentLine]
									.replace(/^\s+/, "")
									.replace(/\(eval code/g, "(")
									.replace(/^.*?\s+/, "");

								const location = formatedLine.match(/ (\(.+\)$)/);
								if (location) formatedLine = formatedLine.replace(location[0], "");

								const locationParts = extractLocation(location ? location[1] : formatedLine);

								fileName = ["eval", "<anonymous>"].includes(locationParts[0]) ? void 0 : locationParts[0];
								line = Number(locationParts[1]);
								column = Number(locationParts[2]);
								break;
							}

							// @ts-ignore
							window.onerror(error.message, fileName, line, column, error);
						}
						// 反之我们只能不考虑报错文件信息，直接调用onerror
						else {
							try {
								// @ts-ignore
								let [_, src = void 0, line = void 0, column = void 0] = /at\s+.*\s+\((.*):(\d*):(\d*)\)/i.exec(error.stack.split("\n")[1]);
								if (typeof line == "string") line = Number(line);
								if (typeof column == "string") column = Number(column);
								// @ts-ignore
								window.onerror(error.message, src, line, column, error);
							} catch (e) {
								window.onerror(error.message, "", 0, 0, error);
							}
						}
					}
				});
			};
		})();
	</script>
	<script type="module" src="./noname/entry.ts"></script>
</head>
<body>
	<div id="startup-loading" class="startup-loading" role="status" aria-live="polite" aria-busy="true">
		<div class="startup-loading__content">
			<div class="startup-loading__emblem" aria-hidden="true">杀</div>
			<div class="startup-loading__title">无名杀</div>
			<div class="startup-loading__message" data-startup-loading-message>正在准备运行环境…</div>
			<div class="startup-loading__track" aria-hidden="true"></div>
			<div class="startup-loading__hint">首次访问需要下载较多资源，请耐心等待</div>
		</div>
	</div>
</body>
